name: Windows EXE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEPENDENCY_CHECK_DATA_DIRECTORY: ${{ runner.temp }}/dependency-check-data
    steps:
      - name: Validate installer version
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '\A(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})\z') {
            throw 'Version must be major.minor.patch with no leading zeros.'
          }
          $parts = $env:RELEASE_VERSION.Split('.')
          if ([int]$parts[0] -gt 255 -or [int]$parts[1] -gt 255 -or [int]$parts[2] -gt 65535) {
            throw 'Windows installer version limits are 255.255.65535.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java for the Maven build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Require vulnerability database credentials
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NVD_API_KEY)) {
            throw 'Configure the NVD_API_KEY repository secret; releases require a successful vulnerability scan.'
          }

      - name: Read vulnerability database cache version
        id: dependency-check-version
        run: |
          [xml]$pom = Get-Content pom.xml -Raw
          $version = $pom.project.properties.'dependency-check.version'
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Missing Dependency-Check version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore vulnerability database
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIRECTORY }}
          key: dependency-check-${{ runner.os }}-${{ steps.dependency-check-version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ steps.dependency-check-version.outputs.version }}-

      - name: Update vulnerability database (first download can take an hour)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress -Psecurity-scan org.owasp:dependency-check-maven:update-only `
            "-DdataDirectory=$env:DEPENDENCY_CHECK_DATA_DIRECTORY" "-DnvdValidForHours=0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache successfully updated vulnerability database before scanning
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIRECTORY }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}

      - name: Rebuild, test, inventory, and scan all resolved dependencies
        env:
          SPRING_CONFIG_LOCATION: classpath:/application.yml
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress -Psecurity-scan clean verify `
            "-DdataDirectory=$env:DEPENDENCY_CHECK_DATA_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($report in @('bom.json', 'bom.xml', 'dependency-tree.txt', 'dependency-check-report.json', 'dependency-check-report.html')) {
            if (-not (Test-Path "target/$report")) { throw "Missing required security evidence: $report" }
          }

      - name: Preserve scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-evidence
          path: |
            target/bom.*
            target/dependency-tree.txt
            target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

      - name: Package Windows installer with bundled runtime
        run: |
          if ($env:WIX) { $env:Path += ";$env:WIX\bin" }
          Get-Command candle.exe, light.exe -ErrorAction Stop
          New-Item -ItemType Directory -Path package-input, dist | Out-Null
          $jars = @(Get-ChildItem target -Filter '*.jar')
          if ($jars.Count -ne 1) { throw 'Expected exactly one application JAR.' }
          Copy-Item $jars[0].FullName package-input/application.jar
          jpackage --type exe `
            --name AcrobatSignBulkOperations `
            --app-version "$env:RELEASE_VERSION" `
            --input package-input `
            --main-jar application.jar `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --dest dist `
            --java-options '-Dserver.address=127.0.0.1' `
            --win-console `
            --win-per-user-install `
            --win-dir-chooser `
            --win-upgrade-uuid 89d18a35-44ea-4cbb-b969-ac5a6a7641be
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only distribute the blank-key template, never the root configuration or output data.
          Copy-Item src/main/resources/application.yml dist/application.yml
          Copy-Item target/bom.json, target/bom.xml, target/dependency-tree.txt, target/dependency-check-report.json, target/dependency-check-report.html dist/
          if (-not (Get-ChildItem dist -Filter '*.exe')) { throw 'Installer was not created.' }

      - name: Create release ZIP
        run: |
          Compress-Archive -Path dist/*.exe, dist/application.yml, dist/bom.*, dist/dependency-tree.txt, dist/dependency-check-report.* `
            -DestinationPath "dist/AcrobatSignBulkOperations-$env:RELEASE_VERSION-windows-x64.zip" `
            -ErrorAction Stop
          $zip = Get-Item "dist/AcrobatSignBulkOperations-$env:RELEASE_VERSION-windows-x64.zip"
          "$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" |
            Set-Content -Encoding ascii "dist/$($zip.Name).sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/*.zip dist/*.sha256 \
            --target "$RELEASE_COMMIT" \
            --title "Acrobat Sign Bulk Operations ${RELEASE_VERSION}" \
            --notes "Download and extract the Windows x64 ZIP containing the installer with a bundled Java runtime and application.yml. Run the installer, configure your integration key and baseUrl in the extracted application.yml, and launch the installed executable from that configuration folder. See the README at this release tag for full instructions. The installer is unsigned."
